# Build every package for every target in a container of that distribution,
# test-install it from a repository signed with a throwaway key, and, on main,
# publish it signed with the real key, then install it from the live URL.
# The weekly run rebuilds everything against the current distributions
# without publishing, so a recipe that stopped building shows up here.
name: build

on:
  pull_request:
  push:
    branches: [main]
    # A push that changes only docs has nothing to publish.
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main's build again (with resign or withdraw). Only main can publish.
        type: boolean
        default: false
      resign:
        description: Re-sign every published package and index (key rotation; needs publish).
        type: boolean
        default: false
      withdraw:
        description: Space-separated package file names to remove from the repositories (needs publish).
        type: string
        default: ""

permissions:
  contents: read

# bash, not the container's sh: Debian's is dash, which the steps' bash
# syntax (read -a, <<<) breaks.
defaults:
  run:
    shell: bash

# Every run that can publish (pushes, and manual runs with publish ticked)
# shares one group, so publishes happen in commit order and an older run's
# recipes never drop a newer run's package. Runs that never publish (weekly,
# manual without publish) have their own, so they cannot replace a push run
# waiting its turn. Never re-run an old run on main: it would publish that
# commit's recipes over newer ones. Run build.yml with publish ticked instead.
concurrency:
  group: >-
    build-${{ github.ref }}${{ (github.event_name == 'schedule' ||
    (github.event_name == 'workflow_dispatch' && !inputs.publish)) && '-nopublish' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPOT_URL: https://pkgs.c-137.me

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/lint.sh
      - uses: docker://rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d # 1.7.7
        with:
          args: -color

  # What this run builds (scripts/matrix.sh): only the packages and targets
  # the change can affect, so a version bump builds one package, not all of
  # them. The base it diffs against:
  #   - a pull request: its base commit;
  #   - a push to main: the last push whose run passed, so a change whose run
  #     failed or was cancelled still gets built and published by the next;
  #   - a manual run on another branch (bump.yml starts one per update PR,
  #     since PRs it opens start no workflows): main.
  # The weekly run, a manual run on main and anything matrix.sh cannot place
  # build everything. Docs-only changes build nothing, and `ok` still reports.
  # A paths filter on pull_request would skip the whole workflow, `ok`
  # included, and leave such a PR unmergeable.
  plan:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # this workflow's runs on main
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      build: ${{ steps.matrix.outputs.build }}
      repo: ${{ steps.matrix.outputs.repo }}
      publish: ${{ steps.matrix.outputs.publish }}
      test: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          base=
          case $EVENT in
            pull_request) base=$PR_BASE ;;
            push)
              shas=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?branch=main&event=push&status=success&per_page=50" \
                --jq '.workflow_runs[].head_sha') || shas=
              for sha in $shas; do
                if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then
                  base=$sha
                  break
                fi
              done
              ;;
            workflow_dispatch)
              if [ "$REF" != refs/heads/main ]; then base=origin/main; fi
              ;;
          esac
          echo "base: ${base:-none, so everything builds}"
          # Recent build times, so matrix.sh starts the longest builds first.
          export DEPOT_DURATIONS=$RUNNER_TEMP/durations
          scripts/durations.sh "$REPO" >"$DEPOT_DURATIONS" || true
          matrix=$(scripts/matrix.sh ${base:+"$base"})
          for key in build repo publish test; do
            echo "$key=$(jq -c ".$key" <<<"$matrix")" >>"$GITHUB_OUTPUT"
          done
          echo "any=$(jq '.build | length > 0' <<<"$matrix")" >>"$GITHUB_OUTPUT"

  # Each package builds in a job of its own, so one package's build code
  # never sees another package's output. It does not wait for lint, which
  # runs alongside; `ok` needs both.
  build:
    name: build (${{ matrix.target }}, ${{ matrix.package }})
    timeout-minutes: 60
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Upstream build code runs in this job, so it gets no secrets and a
    # read-only token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build.sh "$TARGET" out "$PACKAGE"
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ matrix.target }}-${{ matrix.package }}
          path: out/
          if-no-files-found: error
          # Package files are compressed already.
          compression-level: 0

  # Gather each target's packages, check them, and sign a test repository
  # with a throwaway key. Only depot's own scripts run here.
  repo:
    name: repo (${{ matrix.target }})
    timeout-minutes: 20
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.repo) }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      TARGET: ${{ matrix.target }}
      PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Several artifacts land in artifacts/<name>/, but a single one straight
      # in the path, so a lone package gets its directory named here.
      # (merge-multiple would let one job's files into another's directory.)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-${{ matrix.target }}-*
          path: >-
            ${{ contains(matrix.packages, ' ') && 'artifacts' ||
            format('artifacts/built-{0}-{1}', matrix.target, matrix.packages) }}
      - run: scripts/build.sh --prepare "$TARGET"
      - run: |
          read -ra pkgs <<<"$PACKAGES"
          scripts/collect.sh "$TARGET" artifacts out "${pkgs[@]}"
      - run: scripts/test-check-package.sh "$TARGET" out
      - run: scripts/test-repo.sh "$TARGET" out repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          # Package files are compressed already.
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-repo-${{ matrix.target }}
          path: repo/
          if-no-files-found: error
          # Package files are compressed already.
          compression-level: 0

  # Install what this run built from the test repository, in each image that
  # installs the target (lib.sh's run_images: Arch and CachyOS for arch). The
  # target's other packages are installed from the live repository first, so
  # a file clash with one of them fails here, before publishing.
  test:
    name: test (${{ matrix.target }}, ${{ matrix.image }})
    timeout-minutes: 30
    needs: [plan, repo]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-repo-${{ matrix.target }}
          path: repo
      - run: |
          read -ra rest <<<"$OTHERS"
          if [ ${#rest[@]} -gt 0 ]; then
            DEPOT_INSTALL_ONLY=1 scripts/install-test.sh "$TARGET" "$DEPOT_URL" keys/depot.asc "${rest[@]}"
          fi
          read -ra pkgs <<<"$PACKAGES"
          scripts/install-test.sh "$TARGET" "file://$PWD/repo" repo/depot-test.asc "${pkgs[@]}"
        env:
          TARGET: ${{ matrix.target }}
          PACKAGES: ${{ matrix.packages }}
          OTHERS: ${{ matrix.others }}

  # The one check the main ruleset requires, so the ruleset does not have to
  # name every matrix job. It passes only if lint and plan passed and, when
  # plan found something to build, every build, repository and test job
  # passed; when it found nothing, they must have been skipped. always(), so
  # a cancelled run still reports a failure.
  ok:
    timeout-minutes: 5
    needs: [lint, plan, build, repo, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e '(.plan.outputs.any == "true") as $any
            | .lint.result == "success" and .plan.result == "success"
            and all(.build, .repo, .test; .result == (if $any then "success" else "skipped" end))' \
            <<<"$RESULTS" >/dev/null
          echo "lint passed; build and test passed or were not needed"

  # Publish the targets this run built. publish.sh keeps every package this
  # run did not build as it is published.
  publish:
    name: publish (${{ matrix.target }})
    timeout-minutes: 20
    # lint too: main's squash commit is a tree no pull request run linted.
    needs: [lint, plan, test]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    # The signing key and upload token are secrets of this environment, which
    # only main may use.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.publish) }}
    concurrency:
      group: publish-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Only depot's own scripts run here: they sign and index the packages from
    # the build job and never execute them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.target }}
          path: built
      # Distribution install scripts run here, so this step gets no secrets.
      - run: scripts/repo-tools.sh "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: scripts/publish.sh "$TARGET" built
        env:
          TARGET: ${{ matrix.target }}
          DEPOT_SIGNING_KEY: ${{ secrets.DEPOT_SIGNING_KEY }}
          DEPOT_UPLOAD_TOKEN: ${{ secrets.DEPOT_UPLOAD_TOKEN }}
          DEPOT_RESIGN: ${{ inputs.resign && '1' || '' }}
          DEPOT_WITHDRAW: ${{ inputs.withdraw }}

  # Install every package of each published target from the live URL.
  verify:
    name: verify (${{ matrix.target }}, ${{ matrix.image }})
    timeout-minutes: 20
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test) }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-test.sh "$TARGET" "$DEPOT_URL" keys/depot.asc
        env:
          TARGET: ${{ matrix.target }}

  report:
    timeout-minutes: 10
    needs: [lint, plan, build, repo, test, publish, verify]
    if: >-
      failure() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        run: |
          scripts/report.sh open "build on main failed" \
            "A scheduled rebuild or a publish from main failed: $RUN_URL. Either a recipe no longer builds or installs cleanly against the current distributions, or publishing failed and the repositories were not updated. Fix it; bump the release if a published package is affected."
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
