# Build every package for every target in a container of that distribution,
# test-install it from a repository signed with a throwaway key, and, on main,
# publish it signed with the real key, then install it from the live URL.
# The weekly run rebuilds everything against the current distributions
# without publishing, so a recipe that stopped building shows up here.
name: build

on:
  pull_request:
  push:
    branches: [main]
    # A push that changes only docs has nothing to publish.
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main's build again (with resign or withdraw). Only main can publish.
        type: boolean
        default: false
      resign:
        description: Re-sign every published package and index (key rotation; needs publish).
        type: boolean
        default: false
      withdraw:
        description: Space-separated package file names to remove from the repositories (needs publish).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPOT_URL: https://pkgs.c-137.me

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/lint.sh
      - uses: docker://rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d # 1.7.7
        with:
          args: -color

  # Whether this run has to build. A pull request that changes only docs
  # (docs/** and *.md) skips build and test, and `ok` still reports, so the
  # ruleset's required check passes. Every other event builds everything.
  # A paths filter on pull_request would skip the whole workflow, `ok`
  # included, and leave such a PR unmergeable.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...HEAD")
            printf '%s\n' "$files"
            if [ -z "$(grep -vE '^docs/|\.md$' <<<"$files" || true)" ]; then
              code=false
            fi
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"

  build:
    timeout-minutes: 45
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arch, image: "docker.io/library/archlinux:base-devel" }
          - { target: debian-trixie, image: "docker.io/library/debian:trixie" }
          - { target: fedora-44, image: "registry.fedoraproject.org/fedora:44" }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Upstream build code runs in this job, so it gets no secrets and a
    # read-only token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build.sh ${{ matrix.target }} out
      - run: scripts/test-check-package.sh ${{ matrix.target }} out
      - run: scripts/test-repo.sh ${{ matrix.target }} out repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-repo-${{ matrix.target }}
          path: repo/
          if-no-files-found: error

  test:
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arch, image: "docker.io/library/archlinux:latest" }
          # CachyOS uses the Arch repository too.
          - { target: arch, image: "docker.io/cachyos/cachyos-v3:latest" }
          - { target: debian-trixie, image: "docker.io/library/debian:trixie" }
          - { target: fedora-44, image: "registry.fedoraproject.org/fedora:44" }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-repo-${{ matrix.target }}
          path: repo
      - run: scripts/install-test.sh ${{ matrix.target }} "file://$PWD/repo" repo/depot-test.asc

  # The one check the main ruleset requires, so the ruleset does not have to
  # name every matrix job: it passes only if lint passed and, unless the
  # change is docs only, every build and every test passed.
  ok:
    timeout-minutes: 5
    needs: [lint, changes, build, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          needs.lint.result != 'success' || needs.changes.result != 'success' ||
          (needs.changes.outputs.code == 'true' &&
          (needs.build.result != 'success' || needs.test.result != 'success'))
        run: exit 1
      - run: echo "lint passed; build and test passed or were not needed"

  publish:
    timeout-minutes: 20
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    # The signing key and upload token are secrets of this environment, which
    # only main may use.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arch, image: "docker.io/library/archlinux:latest" }
          - { target: debian-trixie, image: "docker.io/library/debian:trixie" }
          - { target: fedora-44, image: "registry.fedoraproject.org/fedora:44" }
    concurrency:
      group: publish-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Only depot's own scripts run here: they sign and index the packages from
    # the build job and never execute them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.target }}
          path: built
      # Distribution install scripts run here, so this step gets no secrets.
      - run: scripts/repo-tools.sh ${{ matrix.target }}
      - run: scripts/publish.sh ${{ matrix.target }} built
        env:
          DEPOT_SIGNING_KEY: ${{ secrets.DEPOT_SIGNING_KEY }}
          DEPOT_UPLOAD_TOKEN: ${{ secrets.DEPOT_UPLOAD_TOKEN }}
          DEPOT_RESIGN: ${{ inputs.resign && '1' || '' }}
          DEPOT_WITHDRAW: ${{ inputs.withdraw }}

  verify:
    timeout-minutes: 20
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arch, image: "docker.io/library/archlinux:latest" }
          # CachyOS uses the Arch repository too.
          - { target: arch, image: "docker.io/cachyos/cachyos-v3:latest" }
          - { target: debian-trixie, image: "docker.io/library/debian:trixie" }
          - { target: fedora-44, image: "registry.fedoraproject.org/fedora:44" }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-test.sh ${{ matrix.target }} "$DEPOT_URL" keys/depot.asc

  report:
    timeout-minutes: 10
    needs: [lint, build, test, publish, verify]
    if: >-
      failure() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        run: |
          scripts/report.sh open "build on main failed" \
            "A scheduled rebuild or a publish from main failed: $RUN_URL. Either a recipe no longer builds or installs cleanly against the current distributions, or publishing failed and the repositories were not updated. Fix it; bump the release if a published package is affected."
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
