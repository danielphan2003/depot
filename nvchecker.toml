# Upstream release sources for scripts/nvcheck.sh (nvchecker 2.x). One entry
# per package directory, with the same name. Docs:
# https://nvchecker.readthedocs.io/en/latest/usage.html

[age-plugin-fido2-hmac]
source = "github"
github = "olastor/age-plugin-fido2-hmac"
use_latest_release = true
prefix = "v"

[avbroot]
source = "github"
github = "chenxiaolong/avbroot"
use_latest_release = true
prefix = "v"

[carapace]
source = "github"
github = "carapace-sh/carapace-bin"
use_latest_release = true
prefix = "v"

[custota-tool]
source = "github"
github = "chenxiaolong/Custota"
use_latest_release = true
prefix = "v"

[dpibreak]
source = "github"
github = "dilluti0n/dpibreak"
use_latest_release = true
prefix = "v"

[dufs]
source = "github"
github = "sigoden/dufs"
use_latest_release = true
prefix = "v"

# Ente's monorepo tags every app; only the ente-cli-v tags are the CLI.
[ente-cli]
source = "github"
github = "ente/ente"
use_max_tag = true
include_regex = "ente-cli-v[0-9.]+"
prefix = "ente-cli-v"

[flyctl]
source = "github"
github = "superfly/flyctl"
use_latest_release = true
prefix = "v"

[ghq]
source = "github"
github = "x-motemen/ghq"
use_latest_release = true
prefix = "v"

[gitea-tea]
source = "gitea"
gitea = "gitea/tea"
host = "gitea.com"
use_max_tag = true
include_regex = "v[0-9.]+"
prefix = "v"

[lazygit]
source = "github"
github = "jesseduffield/lazygit"
use_latest_release = true
prefix = "v"

[starship]
source = "github"
github = "starship/starship"
use_latest_release = true
prefix = "v"

[fcitx5-lotus]
source = "github"
github = "LotusInputMethod/fcitx5-lotus"
use_latest_release = true
prefix = "v"

[freesmlauncher]
source = "github"
github = "FreesmTeam/FreesmLauncher"
use_latest_release = true

[run0-sudo-shim]
source = "github"
github = "GrimmTheShrimp/run0-sudo-shim"
use_latest_release = true

[railway-cli]
source = "github"
github = "railwayapp/cli"
use_latest_release = true
prefix = "v"

[bun]
source = "github"
github = "oven-sh/bun"
use_latest_release = true
prefix = "bun-v"

[nodejs]
# The newest stable release, never an alpha or RC tag. Since Node 27 every
# major becomes LTS (one a year: stable in April, LTS in October), and a new
# major spends the six months before that as an alpha (nodejs/Release,
# schedule.json). So this takes 27 once it is stable, on 2027-04-22.
source = "github"
github = "nodejs/node"
use_max_tag = true
include_regex = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
prefix = "v"

[nushell]
source = "github"
github = "nushell/nushell"
use_latest_release = true

[zellij]
source = "github"
github = "zellij-org/zellij"
use_latest_release = true
prefix = "v"

